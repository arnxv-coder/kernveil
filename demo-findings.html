<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Findings — Kernveil demo workspace</title>
  <meta name="description" content="Interactive product preview — prioritized findings for a fictional sample company. All data is demo data." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#05080f" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305080f'/%3E%3Cpath d='M6 21 C8.2 14.5 12 11.5 16 11.5 C20 11.5 23.8 14.5 26 21' stroke='%232ae6c7' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M9 24.5 C11.5 19.5 13.8 17.2 16 17.2 C18.2 17.2 20.5 19.5 23 24.5' stroke='%237ddbf4' stroke-width='1.7' fill='none' stroke-linecap='round' opacity='0.55'/%3E%3Ccircle cx='16' cy='14' r='2' fill='%2353f3d6'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/dashboard.css" />
</head>
<body class="demo-body" data-page="findings">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="demo-shell">
    <div class="demo-topbar" id="topbar"></div>
    <aside class="demo-sidebar" id="sidebar"></aside>

    <main class="demo-main" id="main">
      <header class="page-head">
        <h1 class="page-title">Findings</h1>
        <p class="page-sub">Every issue Kernveil has identified, prioritized by what matters most.</p>
      </header>

      <div class="list-card">
        <div class="table-filter-wrap">
          <div class="search-field">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <label class="visually-hidden" for="findingSearch">Search findings</label>
            <input id="findingSearch" type="search" placeholder="Search findings…" autocomplete="off" />
          </div>

          <div class="seg" role="group" aria-label="Filter by severity" id="sevSeg">
            <button type="button" data-sev="all" class="is-active">All</button>
            <button type="button" data-sev="critical">Critical</button>
            <button type="button" data-sev="high">High</button>
            <button type="button" data-sev="medium">Medium</button>
            <button type="button" data-sev="low">Low</button>
          </div>
        </div>

        <div class="table-filter-wrap" style="padding-top:0">
          <div class="seg" role="group" aria-label="Filter by status" id="statusSeg">
            <button type="button" data-status="all" class="is-active">All</button>
            <button type="button" data-status="open">Open</button>
            <button type="button" data-status="in-progress">In progress</button>
            <button type="button" data-status="approved">Approved</button>
            <button type="button" data-status="resolved">Resolved</button>
          </div>

          <div class="chip-set" role="group" aria-label="Filter by category" id="catChips">
            <button type="button" class="chip is-active" data-cat="all">All categories</button>
            <button type="button" class="chip" data-cat="Exposure">Exposure</button>
            <button type="button" class="chip" data-cat="Configuration">Configuration</button>
            <button type="button" class="chip" data-cat="Dependencies">Dependencies</button>
            <button type="button" class="chip" data-cat="Identity">Identity</button>
            <button type="button" class="chip" data-cat="Repositories">Repositories</button>
            <button type="button" class="chip" data-cat="Backups">Backups</button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="table" aria-label="Findings list">
            <thead>
              <tr>
                <th scope="col">Finding</th>
                <th scope="col">Severity</th>
                <th scope="col">Affected asset</th>
                <th scope="col">Status</th>
                <th scope="col">First detected</th>
                <th scope="col">Last checked</th>
              </tr>
            </thead>
            <tbody id="findingRows"></tbody>
          </table>
        </div>

        <div class="empty-state hidden" id="findingEmpty">
          <div class="empty-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M9 4h6l4 4v12H5V4h4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 4v4h6V4M8 13l3 3 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <h3>No findings match</h3>
          <p>Try a different search term or loosen a filter.</p>
          <p class="modal-hint" style="margin-top:0.5rem">This is one of the good outcomes.</p>
        </div>
      </div>

      <p class="result-count" id="findingCount"></p>
    </main>
  </div>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>
  <script src="js/vendor/motion.global.min.js"></script>
  <script src="js/lib/data.js"></script>
  <script src="js/lib/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
