<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assets — Kernveil demo workspace</title>
  <meta name="description" content="Interactive product preview — asset inventory for a fictional sample company. All data is demo data." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#05080f" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305080f'/%3E%3Cpath d='M6 21 C8.2 14.5 12 11.5 16 11.5 C20 11.5 23.8 14.5 26 21' stroke='%232ae6c7' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M9 24.5 C11.5 19.5 13.8 17.2 16 17.2 C18.2 17.2 20.5 19.5 23 24.5' stroke='%237ddbf4' stroke-width='1.7' fill='none' stroke-linecap='round' opacity='0.55'/%3E%3Ccircle cx='16' cy='14' r='2' fill='%2353f3d6'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/dashboard.css" />
</head>
<body class="demo-body" data-page="assets">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="demo-shell">
    <div class="demo-topbar" id="topbar"></div>
    <aside class="demo-sidebar" id="sidebar"></aside>

    <main class="demo-main" id="main">
      <header class="page-head">
        <h1 class="page-title">Assets</h1>
        <p class="page-sub">The 14 systems, repositories, and websites Kernveil monitors in this workspace.</p>
      </header>

      <div class="toolbar">
        <div class="search-field">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <label class="visually-hidden" for="assetSearch">Search assets</label>
          <input id="assetSearch" type="search" placeholder="Search assets…" autocomplete="off" />
        </div>
        <div class="select-field">
          <label class="visually-hidden" for="assetType">Filter by type</label>
          <select id="assetType">
            <option value="all">All types</option>
            <option value="server">Server</option>
            <option value="storage">Storage</option>
            <option value="database">Database</option>
            <option value="application">Application</option>
            <option value="api">API</option>
            <option value="website">Website</option>
            <option value="identity">Identity</option>
          </select>
        </div>
        <div class="select-field">
          <label class="visually-hidden" for="assetEnv">Filter by environment</label>
          <select id="assetEnv">
            <option value="all">All environments</option>
            <option value="Production">Production</option>
            <option value="Staging">Staging</option>
            <option value="Development">Development</option>
          </select>
        </div>
        <div class="select-field">
          <label class="visually-hidden" for="assetSource">Filter by source</label>
          <select id="assetSource">
            <option value="all">All sources</option>
            <option value="Cloud">Cloud</option>
            <option value="Code">Code</option>
            <option value="Website">Website</option>
            <option value="Backups">Backups</option>
          </select>
        </div>
      </div>

      <div class="list-card">
        <div class="table-wrap">
          <table class="table" aria-label="Asset inventory">
            <thead>
              <tr>
                <th scope="col">Asset</th>
                <th scope="col">Type</th>
                <th scope="col">Environment</th>
                <th scope="col">Source</th>
                <th scope="col">Risk status</th>
                <th scope="col">Last checked</th>
              </tr>
            </thead>
            <tbody id="assetRows"></tbody>
          </table>
        </div>
        <div class="empty-state hidden" id="assetEmpty">
          <div class="empty-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
          <h3>No assets match</h3>
          <p>Try a different search term or clear a filter.</p>
        </div>
      </div>

      <p class="result-count" id="assetCount"></p>

      <section class="panel" id="assetSheet" hidden>
        <span class="panel-label">Asset detail</span>
        <div id="assetSheetBody"></div>
      </section>
    </main>
  </div>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>
  <script src="js/vendor/motion.global.min.js"></script>
  <script src="js/lib/data.js"></script>
  <script src="js/lib/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
